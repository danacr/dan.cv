  <script>
    const messages=[
      "Hello, how are you?",
      "Can I help you?",
      "Welcome to my corner of the internet.",
      "Curiosity keeps the lights blinking.",
      "Building useful things, one idea at a time.",
      "Still running. Still learning.",
      "Powered by code and questionable amounts of coffee.",
      "Somewhere, a Cobalt RaQ 3 is humming.",
      "The web was more fun when servers were blue.",
      "Thanks for stopping by."
    ],output=document.querySelector(".intro-text");let message=Math.floor(Math.random()*messages.length),position=0,deleting=false;
    function type(){const text=messages[message];position+=deleting?-1:1;output.textContent=text.slice(0,position);if(!deleting&&position===text.length){deleting=true;setTimeout(type,5000)}else if(deleting&&position===0){deleting=false;message=(message+1)%messages.length;setTimeout(type,200)}else setTimeout(type,10)}
    setTimeout(type,200);

    const viewer=document.querySelector(".video-viewer"),video=viewer.querySelector("video"),videoTitle=document.querySelector("#video-title"),archiveMenu=document.querySelector(".archive-menu");
    function closeVideo(){video.pause();video.removeAttribute("src");video.load();viewer.hidden=true;document.body.style.overflow=""}
    document.querySelectorAll(".play-video").forEach(button=>button.addEventListener("click",()=>{videoTitle.textContent=button.dataset.title;video.src=button.dataset.src;viewer.hidden=false;archiveMenu.open=false;document.body.style.overflow="hidden";video.play().catch(()=>{})}));
    document.querySelectorAll(".view-html").forEach(button=>button.addEventListener("click",async()=>{
      const tab=window.open("","_blank");
      if(!tab)return;
      tab.document.write("<title>Loading archive…</title><p style='font-family:sans-serif'>Loading archive…</p>");
      archiveMenu.open=false;
      try{
        const response=await fetch(button.dataset.src);
        if(!response.ok)throw new Error(`HTTP ${response.status}`);
        let html=await response.text();
        html=html.replace(/<script\b[^>]*>[\s\S]*?<\/script>/gi,"");
        const base=`<base href="${button.dataset.src.replace(/[^/]+$/,"")}">`;
        html=/<head[\s>]/i.test(html)?html.replace(/<head([^>]*)>/i,`<head$1>${base}`):base+html;
        const url=URL.createObjectURL(new Blob([html],{type:"text/html"}));
        tab.location.replace(url);
        setTimeout(()=>URL.revokeObjectURL(url),300000);
      }catch(error){
        tab.document.open();
        tab.document.write(`<title>Archive error</title><p style="font-family:sans-serif">Could not load this archive: ${error.message}</p>`);
        tab.document.close();
      }
    }));
    document.querySelector(".video-close").addEventListener("click",closeVideo);
    viewer.addEventListener("click",event=>{if(event.target===viewer)closeVideo()});
    document.addEventListener("keydown",event=>{if(event.key==="Escape"&&!viewer.hidden)closeVideo()});
  </script>
