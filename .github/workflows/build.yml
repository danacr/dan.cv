name: Deploy static site

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          lfs: true
      - name: Install FTP client
        run: |
          sudo apt-get update
          sudo apt-get install --yes ncftp
      - name: Upload static site
        env:
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
          FTP_HOST: ${{ secrets.FTP_HOST }}
        run: ncftpput -R -v -z -u "$FTP_USER" -p "$FTP_PASS" "$FTP_HOST" /web/ index.html img
